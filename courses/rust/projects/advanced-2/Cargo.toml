[package]
name = "resilience-middleware"
version = "0.1.0"
edition = "2021"
description = "Phase 4, Project 2: Caching and Rate Limiting"

[dependencies]
tokio = { version = "1", features = ["full"] }
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.25", features = ["tokio-comp"] }
tower = "0.4"
axum = { version = "0.7" }
http = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
