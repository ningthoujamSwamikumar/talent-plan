[package]
name = "testing-mastery"
version = "0.1.0"
edition = "2021"
description = "Phase 3, Project 2: Testing Mastery"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
proptest = "1.0"
insta = { version = "1.0", features = ["json"] }
mockall = "0.13"
fake = { version = "2.0", features = ["derive", "chrono", "uuid"] }
